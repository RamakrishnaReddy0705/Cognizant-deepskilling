<h1>{{ portalName }}</h1>
<p>Your one-stop portal to browse courses, manage enrollments, and track your academic progress.</p>

<div class="stats-row">
  <div class="stat"><strong>{{ coursesAvailable$ | async }}</strong><span>Courses Available</span></div>
  <div class="stat"><strong>{{ enrolledCount }}</strong><span>Enrolled</span></div>
  <div class="stat"><strong>{{ gpa }}</strong><span>GPA</span></div>
</div>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p *ngIf="message">{{ message }}</p>

<div class="search-box">
  <input [(ngModel)]="searchTerm" placeholder="Search the portal..." />
  <p>Searching for: {{ searchTerm }}</p>
</div>
